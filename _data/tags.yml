# =============================================================================
# ETICHETTE (tag) usate in Articles e Blog
#
# Un elenco unico e corto per tutto il sito: e' cosi' che i tag restano utili
# (con 20 tag per articolo, come su Substack, non filtrano piu' niente).
#
#   id       il nome da scrivere nel campo "tags" di un articolo (minuscolo, senza spazi)
#   label    come appare sul sito
#   aliases  altre parole che, cercate con la lente, trovano questo tag
#            (anche in italiano: chi cerca "geopolitica" trova i pezzi "Geopolitics")
#
# L'ordine di questo file e' l'ordine dei pulsanti sopra l'elenco. Un tag compare
# tra i pulsanti solo se almeno un articolo di quella pagina lo usa.
# Per aggiungerne uno: copia un blocco, cambia id/label/aliases.
# =============================================================================

- id: philosophy
  label: Philosophy
  aliases: [filosofia, metaphysics, metafisica, epistemology, epistemologia, pragmatism, pragmatismo, naturalism, naturalismo]

- id: logic
  label: Logic
  aliases: [logica, formal logic, logica formale, mathematics, matematica, information theory, teoria dell'informazione]

- id: science
  label: Science
  aliases: [scienza, philosophy of science, filosofia della scienza, scientism, scientismo, physics, fisica, entropy, entropia, rationality, razionalita]

- id: ethics
  label: Ethics
  aliases: [etica, morale, morality, moral, virtue signaling]

- id: politics
  label: Politics
  aliases: [politica, liberalism, liberalismo, federalism, federalismo, state, stato]

- id: geopolitics
  label: Geopolitics
  aliases: [geopolitica, europe, europa, european union, unione europea, usa, america, defence, difesa]

- id: economics
  label: Economics
  aliases: [economia, economy, capitalism, capitalismo, poverty, poverta, market, mercato]

- id: culture
  label: Culture
  aliases: [cultura, society, societa, identity, identita, humanism, umanesimo, language, linguaggio, censorship, censura]

- id: psychology
  label: Psychology
  aliases: [psicologia, mind, mente, free will, libero arbitrio, self]

- id: ai
  label: AI
  aliases: [ia, artificial intelligence, intelligenza artificiale, chatgpt, chat gpt]

- id: cinema
  label: Cinema
  aliases: [film, movie, movies, spoiler, art, arte]

- id: narrative
  label: Narrative
  aliases: [narrativa, fiction, racconto, racconti, story, storia, novel, romanzo]

heading: "My (currently) Philosophical Ideas, Poorly Summarized:"
paragraphs:
  - >-
    My philosophical stance emerges from the convergence of fallibilism, scientific
    liberal pragmatism, a relational coherentist framework, and an evolutionary
    darwinian understanding of history and politics. I do not seek ultimate
    foundations or absolute truths. What matters is justification: the operational
    coherence of conceptual systems, their empirical responsiveness, and their
    capacity to sustain, revise, and transform themselves within complex and
    changing informational environments.
  - >-
    Truth, in this sense, is not correspondence with an independent metaphysical
    essence of the world, but a functional property of conceptual networks: it is
    the long-term stability of models that successfully constrain expectations,
    generate reliable predictions, and remain resilient under empirical pressure.
    Reality is not accessed directly, but through the structural constraints it
    imposes on our descriptive and explanatory frameworks: models persist insofar
    as they succeed, fail, or are corrected in interaction with the world.
    Accordingly, truth is a function of the stability and integrative capacity of
    conceptual networks over time, while reality is that which, structurally,
    constrains, differentiates, and stabilizes patterns within coherent
    informational frameworks, where logic, statistics, physics, and, more broadly,
    a solid scientific naturalism prevail.
  - >-
    I have been deeply influenced by Peirce, Carnap, Frank Ramsey, Gerhard Vollmer,
    Ludwig Boltzmann, Dretske, Reichenbach, Shannon, and Wolpert (among many
    others). I adopt a deflationary and structural approach to philosophical
    inquiry. Objects, identities, and persistence are not treated as primitive
    givens, but as functional roles within systems of relations. For this reason I
    privilege formal tools such as topology, model and category theory, which
    allow identity, continuity, and transformation to be described in terms of
    structural relations, mappings, and invariants, rather than through intrinsic
    properties. The world is thus approached as a dynamic network of relations,
    describable through informational structures, hierarchical models, or
    conditional configurations, never as a mere collection of isolated entities.
  - >-
    Within this framework, history is not a linear or teleological process, nor
    the unfolding of moral ideals, but an emergent trajectory shaped by
    technological, institutional, and ecological variation. Change occurs through
    selective retention: tools, languages, and institutions persist when they
    prove more adaptive within their informational and environmental constraints.
    Societies do not evolve through moral enlightenment alone or through
    collective will, but because certain organizational structures outperform
    others in terms of adaptability, scalability, and resilience under specific
    material and informational conditions.
  - >-
    Culture, in this sense, functions as a selectively transmitted system of
    information, and human historicity is expressed through the accumulation,
    transmission, and reconfiguration of such structures over time. Failure is not
    a deviation from progress, but a central epistemic and adaptive mechanism: it
    is through breakdowns, inefficiencies, and competitive elimination that
    informational systems improve.
  - >-
    My political philosophy is grounded in scientific rationality and pragmatism,
    which I regard as the most reliable methods for understanding and managing
    complex social systems. Politics, from this perspective, is not primarily a
    domain of moral absolutes, but a problem of adaptive coordination under
    constraint. Efficiency here is always relative to empirically assessable
    outcomes: innovation, growth, error-correction capacity, institutional
    learning, and systemic resilience. For these reasons, I tend to favor
    decentralized and minimally intrusive institutional arrangements when models
    and empirical evidence indicate that they maximize adaptive variation and
    feedback, while recognizing that regulatory structures are sometimes necessary
    to correct systemic risks, coordination failures, and long-term collective
    action problems. The role of the state, in this view, is not to impose
    substantive ends, but to maintain stable background conditions that allow
    decentralized experimentation, competition, and the development of individual
    capacities. Excessive centralization tends to reduce the evolutionary
    bandwidth of social systems, limiting variation and slowing adaptive feedback.
    I hold qualified sympathies for technocratic decision-making in domains where
    complexity and technical expertise are indispensable, such as science, health,
    and environmental management, while rejecting centralized and dogmatic
    dirigisme or the political imposition of comprehensive social goals that are
    insulated from empirical revision.
  - >-
    This commitment to institutional adaptability and constrained governance is
    influenced by the economic work of Milton Friedman, by neoclassical growth
    models such as those of Solow and McKenzie, and by Schumpeter's theory, as
    well as by the analyses of Hayek (Carl Schmitt, Barro, Armen Alchian) and von
    Neumann on decentralized coordination and strategic interaction.
  - >-
    Contemporary authors such as Hans Rosling, Steven Pinker, Paul Bloom, and
    Daniel Kahneman have also shaped my outlook, alongside European figures
    including Mario Monti, Mario Draghi, and Romano Prodi. I engage more
    selectively with the work of Samuelson, Peter Diamond, Leonid Hurwicz, Kenneth
    Arrow, and especially Robert Lucas, Nancy Stokey, Thomas J. Sargent and Edward
    Prescott.
  - >-
    Some may classify this orientation as neoliberal, Nozickian, or
    market-liberal. I do not treat these labels as ideological commitments, but as
    descriptive shortcuts. My positions are not derived from moral doctrine, but
    from what I take to be the pragmatic conclusions of economic modeling and
    empirical analysis, always understood as revisable under improved data and
    better theoretical tools.
  - >-
    The idea of a negative or constraint-based realism is particularly compelling
    to me, in which reality is approached primarily through the limits, failures,
    and corrections it imposes on our models rather than through access to
    positive essences. In this sense, processes of negotiation between agents,
    institutions, and models constitute a fundamental mechanism across political,
    economic, social, and epistemic domains, serving both as a practical
    coordination tool and as a heuristic for managing systemic uncertainty. Yes, I
    love U.Eco.
  - >-
    Ultimately, my philosophy is an exercise in structural modeling and pragmatic
    evaluation. I hold that the central questions concerning knowledge,
    explanation, and social organization can be addressed only through the
    integration of formal modeling, evolutionary reasoning, and empirical
    constraint. I admire authors such as Stephen Yablo, Huw Price and Cheryl Misak
    (and, in different ways, Rorty and Stein) for their deflationary and temporal
    perspectives, and I remain skeptical toward moralistic or humanistic
    approaches when they function as substitutes for causal and structural
    explanation. What matters is not what is declared to be meaningful, but what
    persists, what adapts, and what works.

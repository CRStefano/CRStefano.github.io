  title: "Analysis of Supererogatory Reasons – 2026"
  desc: |
    This is my bachelor's thesis and proposes a computational operationalization of epistemic non-necessity through Information Gain.
    By developing a quantitative criterion based on Shannon entropy, the paper defines an algorithm to identify informational redundancy of reasons within specific contexts of inquiry.

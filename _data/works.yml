# ---------------------------- colonna sinistra -------------------------------
- col: left
  title: "The Mind as an Information Filter – 2026"
  desc: "Living systems perceive little of their environment because acquiring information costs free energy needed for survival. This paper introduces a thermodynamic criterion (S-FEEF) proving that compressing perception optimizes metabolic costs against biological viability."
  url: "https://philpapers.org/rec/COEEEC"

- col: left
  title: "Typst: From Zero to Hero – 2026"
  desc: "This technical manual explores the transition from traditional typesetting systems to Typst, utilizing its unique integration of markup, scripting, and real-time compilation to redefine document production in academia and beyond. It emphasizes the relevance of bridging intuitive syntax with high-level design in modern document engineering."
  url: "https://github.com/CRStefano/Typst-Handbook-A-Comprehensive-Guide/blob/main/Typst%20Handbook_FROM%20ZERO%20TO%20HERO_Stefano%20Coelati%20Rama.pdf"

- col: left
  title: "From Arousal to Morpheme – 2025"
  desc: "This paper proposes a biologically grounded model of meaning emergence. By linking arousal-based vocalizations to inferential social roles, I explain how signals evolve into conventional morphemes without prior representation"
  url: "https://docs.google.com/presentation/d/10pO7h6Hxwc6nyJvL6WifzXJoF-gxtvua/edit?usp=sharing&rtpof=true&sd=true"

- col: left
  title: "Naturalizing Time – 2024"
  desc: "This university seminar analyzed the concept of time from a strictly scientific and naturalistic perspective, defining it with the concept of “level of reality” in a pragmatic and pluralistic way"
  url: "https://philpapers.org/rec/COEIAI"

- col: left
  title: "Epitaph for Metaphysics, 2023"
  desc: "A (old) Paper for a university exam. In this paper, I will defend Carnap's Deflationism and Contextualism against metaphysical claims"
  url: "https://philpapers.org/rec/COEFAT-2"

# ---------------------------- colonna destra ---------------------------------
- col: right
  title: "Analysis of Supererogatory Reasons – 2026"
  desc: "This is my bachelor's thesis and proposes a computational operationalization of epistemic non-necessity through Information Gain. By developing a quantitative criterion based on Shannon entropy, the paper defines an algorithm to identify informational redundancy of reasons within specific contexts of inquiry."
  url: "https://philpapers.org/rec/COEIAA-4"

- col: right
  title: "Intelligence as Adherence to Frameworks – 2026"
  desc: "This paper proposes a formal, context-based theory of intelligence, defining it as pragmatic adherence to operational frameworks and providing a taxonomy to distinguish error from cognitive stupidity. It also challenges the notion of ex nihilo creativity by grounding innovation in pre-existing contextual structures."
  url: "https://philpapers.org/rec/COETMA-5"

# Questo lavoro non ha (ancora) un link: senza `url` la voce compare senza "HERE".
# Quando sara' pubblicato basta aggiungere una riga:  url: "https://..."
- col: right
  title: "Identity as Information-Preserving Morphism – 2026"
  desc: "This paper introduces a novel framework that redefines identity and persistence using category theory, information theory, and relational ontology. By treating entities as informational nodes rather than fixed substances, it provides precise, mathematical solutions to classic puzzles like the Ship of Theseus, personal identity, and biological turnover."

- col: right
  title: "Enactivism and Predictive Coding, 2024"
  desc: "This university (draft) paper explores the mind's emergence via information theory, predictive coding, and enactivism, emphasizing the relevance of linking predictive and semantic frameworks in cognitive science and philosophy."
  url: "https://philpapers.org/rec/COELDM"
